<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ダッシュボード</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:        #06C755;
      --green-d:      #05A847;
      --green-light:  #F0FDF4;
      --green-border: #BBF7D0;
      --bg:           #F3F4F6;
      --white:        #FFFFFF;
      --text:         #111827;
      --text2:        #4B5563;
      --text3:        #9CA3AF;
      --border:       #E5E7EB;
      --radius:       12px;
      --shadow-sm:    0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md:    0 4px 20px rgba(0,0,0,0.08);
      --shadow-lg:    0 10px 40px rgba(0,0,0,0.14);
    }

    body {
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased; min-height: 100vh;
    }

    /* ── LOGIN SCREEN ────────────────────────────────────── */
    #loginScreen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
      background: linear-gradient(135deg, #111827 0%, #1F2937 100%);
    }
    .login-logo {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 40px;
    }
    .login-logo-icon {
      width: 44px; height: 44px; background: var(--green);
      border-radius: 12px; display: flex; align-items: center;
      justify-content: center; font-size: 22px;
    }
    .login-logo-text {
      font-size: 18px; font-weight: 700; color: white; letter-spacing: -0.02em;
    }
    .login-card {
      background: var(--white); border-radius: 20px;
      padding: 44px 40px; width: 380px; max-width: 94vw;
      box-shadow: var(--shadow-lg);
    }
    .login-card-title {
      font-size: 22px; font-weight: 800; color: var(--text);
      letter-spacing: -0.03em; margin-bottom: 6px; text-align: center;
    }
    .login-card-sub {
      font-size: 14px; color: var(--text3); text-align: center;
      margin-bottom: 32px;
    }
    .login-label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--text2); margin-bottom: 7px;
    }
    .login-input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 15px; font-family: inherit; color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
      margin-bottom: 16px;
    }
    .login-input:focus {
      outline: none; border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(6,199,85,0.1);
    }
    .login-btn {
      width: 100%; padding: 13px; background: var(--green); color: white;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: background 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 14px rgba(6,199,85,0.3);
    }
    .login-btn:hover:not(:disabled) { background: var(--green-d); box-shadow: 0 6px 20px rgba(6,199,85,0.4); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
    #loginError {
      display: none; margin-top: 14px; padding: 10px 14px;
      background: #FEF2F2; border: 1px solid #FECACA;
      border-radius: 8px; color: #DC2626;
      font-size: 13px; font-weight: 600; text-align: center;
    }
    #lockMsg {
      display: none; margin-top: 14px; padding: 10px 14px;
      background: #FFFBEB; border: 1px solid #FDE68A;
      border-radius: 8px; color: #B45309;
      font-size: 13px; font-weight: 600; text-align: center;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    .admin-header {
      background: #111827; color: white; padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid #1F2937;
    }
    .admin-header-left { display: flex; align-items: center; gap: 12px; }
    .admin-logo {
      width: 32px; height: 32px; background: var(--green);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 16px;
    }
    .admin-title { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
    .admin-header-right { display: flex; align-items: center; gap: 16px; }
    #currentDate { font-size: 13px; color: #9CA3AF; }
    .logout-btn {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #D1D5DB; padding: 7px 16px; border-radius: 8px;
      cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.14); color: white; }

    /* ── LAYOUT ─────────────────────────────────────────── */
    .admin-body { max-width: 1140px; margin: 0 auto; padding: 28px 24px; }

    /* ── STAT CARDS ─────────────────────────────────────── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 16px; margin-bottom: 28px;
    }
    .stat-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 22px 20px;
      box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; gap: 10px;
    }
    .stat-card-icon {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .icon-green  { background: var(--green-light); }
    .icon-blue   { background: #EFF6FF; }
    .icon-purple { background: #F5F3FF; }
    .icon-amber  { background: #FFFBEB; }
    .icon-rose   { background: #FFF1F2; }
    .stat-num {
      font-size: 28px; font-weight: 800; color: var(--text);
      letter-spacing: -0.04em; line-height: 1;
    }
    .stat-lbl { font-size: 12px; color: var(--text3); font-weight: 500; }

    /* ── SECTION CARDS ──────────────────────────────────── */
    .section-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
      box-shadow: var(--shadow-sm); margin-bottom: 24px;
    }
    .section-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
    }
    .section-title {
      font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.02em;
    }
    .refresh-btn {
      display: flex; align-items: center; gap: 6px;
      background: none; border: 1.5px solid var(--border); color: var(--text2);
      padding: 7px 16px; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 600; font-family: inherit;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .refresh-btn:hover:not(:disabled) { border-color: var(--green); color: var(--green); background: var(--green-light); }
    .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── TABLES ─────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th {
      background: var(--bg); padding: 10px 14px; text-align: left;
      font-size: 12px; font-weight: 600; color: var(--text3);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    tbody td { padding: 13px 14px; color: var(--text2); border-bottom: 1px solid var(--border); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #FAFFF9; }

    /* ── BADGES ─────────────────────────────────────────── */
    .badge {
      display: inline-block; padding: 3px 10px;
      border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap;
    }
    .b-active   { background: var(--green-light); color: #16a34a; border: 1px solid var(--green-border); }
    .b-pending  { background: #FFFBEB; color: #B45309; border: 1px solid #FDE68A; }
    .b-canceled { background: var(--bg); color: var(--text3); border: 1px solid var(--border); }
    .b-expired  { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
    .b-refunded { background: #F5F3FF; color: #7C3AED; border: 1px solid #DDD6FE; }
    .b-dev      { background: #DBEAFE; color: #1D4ED8; border: 1px solid #BFDBFE; }
    .dev-row td { background: #EFF6FF !important; }

    /* ── TOGGLE BUTTONS ─────────────────────────────────── */
    .toggle-btn {
      padding: 6px 14px; border-radius: 7px;
      cursor: pointer; font-size: 12px; font-weight: 600;
      white-space: nowrap; font-family: inherit;
      transition: background 0.15s, opacity 0.15s;
    }
    .toggle-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-activate   { background: var(--green-light); color: #16a34a; border: 1.5px solid var(--green-border); }
    .btn-activate:hover:not(:disabled) { background: #DCFCE7; }
    .btn-deactivate { background: #FEF2F2; color: #DC2626; border: 1.5px solid #FECACA; }
    .btn-deactivate:hover:not(:disabled) { background: #FEE2E2; }

    /* ── PAGINATION ─────────────────────────────────────── */
    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 10px; margin-top: 20px; flex-wrap: wrap;
    }
    .page-btn {
      padding: 7px 18px; border: 1.5px solid var(--border);
      border-radius: 8px; background: var(--white); cursor: pointer;
      font-size: 13px; font-weight: 600; font-family: inherit;
      transition: border-color 0.15s, color 0.15s, background 0.15s; color: var(--text2);
    }
    .page-btn:hover:not(:disabled) { border-color: var(--green); color: var(--green); background: var(--green-light); }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-info { font-size: 13px; color: var(--text3); font-weight: 500; }

    .empty   { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 14px; }
    .loading { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 14px; }

    /* ── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 960px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
      .stats-grid .stat-card:nth-child(4) { grid-column: span 1; }
      .stats-grid .stat-card:nth-child(5) { grid-column: span 2; }
    }
    @media (max-width: 680px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .stats-grid .stat-card:nth-child(5) { grid-column: 1 / -1; }
      thead th:nth-child(5), tbody td:nth-child(5),
      thead th:nth-child(6), tbody td:nth-child(6) { display: none; }
      .admin-header { padding: 0 16px; }
      #currentDate { display: none; }
      .admin-body { padding: 16px; }
      .login-card { padding: 32px 24px; }
    }
  </style>
</head>
<body>

<!-- ══ LOGIN SCREEN ══════════════════════════════════════ -->
<div id="loginScreen">
  <div class="login-logo">
    <div class="login-logo-icon">🤖</div>
    <span class="login-logo-text">スマート予約Pro</span>
  </div>
  <div class="login-card">
    <h2 class="login-card-title">管理者ログイン</h2>
    <p class="login-card-sub">管理者パスワードを入力してください</p>
    <label class="login-label" for="pwInput">パスワード</label>
    <input type="password" id="pwInput" class="login-input" placeholder="管理者パスワード">
    <button class="login-btn" id="loginBtn" onclick="doLogin()">ログイン</button>
    <div id="loginError">パスワードが正しくありません</div>
    <div id="lockMsg"></div>
  </div>
</div>

<!-- ══ DASHBOARD ══════════════════════════════════════════ -->
<div id="dashboardScreen" style="display:none;">

  <!-- Header -->
  <header class="admin-header">
    <div class="admin-header-left">
      <div class="admin-logo">🤖</div>
      <span class="admin-title">管理者ダッシュボード</span>
    </div>
    <div class="admin-header-right">
      <span id="currentDate"></span>
      <button class="logout-btn" onclick="doLogout()">ログアウト</button>
    </div>
  </header>

  <div class="admin-body">

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-card-icon icon-green">📅</div>
        <div class="stat-num" id="sTotal">-</div>
        <div class="stat-lbl">総予約数</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon icon-blue">🌅</div>
        <div class="stat-num" id="sToday">-</div>
        <div class="stat-lbl">本日の予約</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon icon-purple">🏪</div>
        <div class="stat-num" id="sShops">-</div>
        <div class="stat-lbl">登録店舗数</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon icon-amber">✅</div>
        <div class="stat-num" id="sPaid">-</div>
        <div class="stat-lbl">有料店舗数</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon icon-rose">💰</div>
        <div class="stat-num" id="sMRR">-</div>
        <div class="stat-lbl">推定MRR</div>
      </div>
    </div>

    <!-- Operations -->
    <div class="section-card">
      <div class="section-head">
        <h2 class="section-title">🩺 運用モニタリング</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="refresh-btn" id="opsRefreshBtn" onclick="loadOps()">↻ 状態確認</button>
          <button class="refresh-btn" id="syncPaymentsBtn" onclick="syncPayments()">決済同期</button>
          <button class="refresh-btn" onclick="downloadBackup()">バックアップ</button>
        </div>
      </div>
      <div class="stats-grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:18px;">
        <div class="stat-card"><div class="stat-num" id="opsStatus">-</div><div class="stat-lbl">システム状態</div></div>
        <div class="stat-card"><div class="stat-num" id="ops24h">-</div><div class="stat-lbl">24h予約数</div></div>
        <div class="stat-card"><div class="stat-num" id="ops7d">-</div><div class="stat-lbl">7日予約数</div></div>
        <div class="stat-card"><div class="stat-num" id="opsSync">-</div><div class="stat-lbl">同期確認対象</div></div>
        <div class="stat-card"><div class="stat-num" id="opsUnresolved">-</div><div class="stat-lbl">未確定相談</div></div>
      </div>
      <div id="opsTable"><div class="loading">読み込み中...</div></div>
    </div>

    <!-- Support -->
    <div class="section-card">
      <div class="section-head">
        <h2 class="section-title">🎧 顧客サポート</h2>
        <span style="font-size:13px;color:var(--text3);">店舗を選択すると予約・会話・カルテを確認できます</span>
      </div>
      <div id="supportPanel"><div class="empty">店舗一覧の「詳細」から確認してください</div></div>
    </div>

    <!-- Reservations -->
    <div class="section-card">
      <div class="section-head">
        <h2 class="section-title">📅 予約一覧</h2>
        <button class="refresh-btn" id="refreshResBtn" onclick="reloadReservations()">↻ 更新</button>
      </div>
      <div id="reservationTable"><div class="loading">読み込み中...</div></div>
      <div class="pagination" id="resPager"></div>
    </div>

    <!-- Shops -->
    <div class="section-card">
      <div class="section-head">
        <h2 class="section-title">🏪 登録店舗一覧</h2>
        <button class="refresh-btn" id="refreshShopBtn" onclick="reloadShops()">↻ 更新</button>
      </div>
      <div id="shopTable"><div class="loading">読み込み中...</div></div>
      <div class="pagination" id="shopPager"></div>
    </div>

  </div>
</div>

<script>
'use strict';

const PAGE_SIZE  = 20;
const BASE_PRICE = 2980;

const PLAN_MAP = {
  active:    ['稼働中',     'b-active'],
  trial:     ['トライアル', 'b-active'],
  pending:   ['未払い',     'b-pending'],
  canceled:  ['キャンセル', 'b-canceled'],
  suspended: ['停止中',     'b-canceled'],
  expired:   ['期限切れ',   'b-expired'],
  refunded:  ['返金済み',   'b-refunded'],
  past_due:  ['支払い遅延', 'b-expired'],
  paused:    ['一時停止',   'b-canceled'],
  unknown:   ['要確認',     'b-pending'],
};

const DEVELOPER_EMAIL = 'hohomi4847@gmail.com';

let adminPw = '';
let allRes   = [];
let allShops = [];
let resPage  = 1;
let shopPage = 1;

// ─── ヘッダー生成 ─────────────────────────────────────────
function hdr(json) {
  const h = { 'x-admin-password': adminPw };
  if (json) h['Content-Type'] = 'application/json';
  return h;
}

// ─── 認証 ─────────────────────────────────────────────────
async function doLogin() {
  // ブルートフォース保護: 5回失敗 → 30分ロック
  const lockUntil = parseInt(localStorage.getItem('admin_lock_until') || '0', 10);
  if (Date.now() < lockUntil) {
    const remaining = Math.ceil((lockUntil - Date.now()) / 60000);
    const lockMsgEl = document.getElementById('lockMsg');
    lockMsgEl.textContent = `ログイン試行回数が上限に達しました。${remaining}分後に再試行してください。`;
    lockMsgEl.style.display = 'block';
    return;
  }

  const pw    = document.getElementById('pwInput').value;
  const btn   = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  if (!pw) return;

  errEl.style.display = 'none';
  document.getElementById('lockMsg').style.display = 'none';
  btn.disabled = true;

  try {
    const res = await fetch('/api/dashboard', { headers: { 'x-admin-password': pw } });
    if (res.status === 401) {
      const fails = parseInt(localStorage.getItem('admin_fail_count') || '0', 10) + 1;
      if (fails >= 5) {
        localStorage.setItem('admin_lock_until', String(Date.now() + 30 * 60 * 1000));
        localStorage.setItem('admin_fail_count', '0');
        document.getElementById('lockMsg').textContent = 'ログイン試行回数が上限に達しました。30分後に再試行してください。';
        document.getElementById('lockMsg').style.display = 'block';
        errEl.style.display = 'none';
      } else {
        localStorage.setItem('admin_fail_count', String(fails));
        errEl.textContent = `パスワードが正しくありません（${fails}/5回）`;
        errEl.style.display = 'block';
      }
      document.getElementById('pwInput').value = '';
      return;
    }
    localStorage.setItem('admin_fail_count', '0');
    localStorage.removeItem('admin_lock_until');
    const data = await res.json();
    adminPw = pw;
    sessionStorage.setItem('admin_pw', pw);
    renderDashboard(data);
  } catch (e) {
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

function doLogout() {
  sessionStorage.removeItem('admin_pw');
  adminPw = '';
  document.getElementById('dashboardScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display     = 'flex';
  document.getElementById('pwInput').value = '';
}

// ─── 起動時: 保存パスワードで自動ログイン ─────────────────
async function init() {
  document.getElementById('currentDate').textContent =
    new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });

  // Enter キー対応
  document.getElementById('pwInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  // ロック状態の表示
  const lockUntil = parseInt(localStorage.getItem('admin_lock_until') || '0', 10);
  if (Date.now() < lockUntil) {
    const remaining = Math.ceil((lockUntil - Date.now()) / 60000);
    document.getElementById('lockMsg').textContent = `ログイン試行回数が上限に達しました。${remaining}分後に再試行してください。`;
    document.getElementById('lockMsg').style.display = 'block';
  }

  const saved = sessionStorage.getItem('admin_pw');
  if (!saved) return;

  try {
    const res = await fetch('/api/dashboard', { headers: { 'x-admin-password': saved } });
    if (res.status === 401) { sessionStorage.removeItem('admin_pw'); return; }
    const data = await res.json();
    adminPw = saved;
    renderDashboard(data);
  } catch (e) {
    // ネットワーク不可時: ログイン画面のまま
  }
}

// ─── ダッシュボード描画 ────────────────────────────────────
function renderDashboard(data) {
  document.getElementById('loginScreen').style.display     = 'none';
  document.getElementById('dashboardScreen').style.display = 'block';

  allRes   = data.reservations || [];
  allShops = data.shops        || [];
  resPage  = 1;
  shopPage = 1;

  updateStats(data.todayReservations);
  renderReservations();
  renderShops();
  loadOps();
}

function updateStats(todayCount) {
  const paid = allShops.filter(s => s.is_paid).length;
  document.getElementById('sTotal').textContent = allRes.length;
  document.getElementById('sToday').textContent = todayCount != null ? todayCount : '-';
  document.getElementById('sShops').textContent = allShops.length;
  document.getElementById('sPaid').textContent  = paid;
  document.getElementById('sMRR').textContent   = '¥' + (paid * BASE_PRICE).toLocaleString();
}

// ─── 予約テーブル ──────────────────────────────────────────
function renderReservations() {
  const wrap = document.getElementById('reservationTable');

  if (allRes.length === 0) {
    wrap.innerHTML = '<div class="empty">予約はまだありません</div>';
    document.getElementById('resPager').innerHTML = '';
    return;
  }

  const slice = allRes.slice((resPage - 1) * PAGE_SIZE, resPage * PAGE_SIZE);
  const tbl   = document.createElement('table');

  // thead
  const hrow = tbl.createTHead().insertRow();
  ['お客様名', 'サービス', '予約日', '時間', '状態', '登録日'].forEach(text => {
    const th = document.createElement('th');
    th.textContent = text;
    hrow.appendChild(th);
  });

  // tbody
  const tbody = tbl.createTBody();
  slice.forEach(r => {
    const tr = tbody.insertRow();

    // テキストセル (XSS安全)
    [
      r.customer_name  || '-',
      r.service_type   || '-',
      r.reservation_date || '-',
      r.reservation_time ? r.reservation_time.slice(0, 5) : '-',
    ].forEach(v => { tr.insertCell().textContent = v; });

    // 状態バッジ
    const stTd  = tr.insertCell();
    const badge = document.createElement('span');
    const isConf = r.status === 'confirmed';
    badge.className   = 'badge ' + (isConf ? 'b-active' : 'b-canceled');
    badge.textContent = isConf ? '確定' : (r.status || '-');
    stTd.appendChild(badge);

    // 登録日
    const dtTd = tr.insertCell();
    try { dtTd.textContent = new Date(r.created_at).toLocaleDateString('ja-JP'); }
    catch { dtTd.textContent = '-'; }
  });

  wrap.innerHTML = '';
  wrap.appendChild(tbl);
  renderPager('resPager', allRes.length, resPage, p => { resPage = p; renderReservations(); });
}

// ─── 店舗テーブル ──────────────────────────────────────────
function renderShops() {
  const wrap = document.getElementById('shopTable');

  if (allShops.length === 0) {
    wrap.innerHTML = '<div class="empty">登録店舗はまだありません</div>';
    document.getElementById('shopPager').innerHTML = '';
    return;
  }

  const slice = allShops.slice((shopPage - 1) * PAGE_SIZE, shopPage * PAGE_SIZE);
  const tbl   = document.createElement('table');

  const hrow = tbl.createTHead().insertRow();
      ['店舗名', '業種', 'メール', 'プラン状態', '操作', 'サポート', '登録日'].forEach(text => {
    const th = document.createElement('th');
    th.textContent = text;
    hrow.appendChild(th);
  });

  const tbody = tbl.createTBody();
  slice.forEach(s => {
    const tr    = tbody.insertRow();
    const isDev = s.owner_email === DEVELOPER_EMAIL;

    if (isDev) tr.classList.add('dev-row');

    // 店舗名 (開発者店舗はバッジ付き)
    const nameTd = tr.insertCell();
    nameTd.textContent = s.shop_name || '-';
    if (isDev) {
      const devBadge = document.createElement('span');
      devBadge.className   = 'badge b-dev';
      devBadge.textContent = '🔧 開発者';
      devBadge.style.marginLeft = '6px';
      nameTd.appendChild(devBadge);
    }

    [s.business_type || '-', s.owner_email || '-'].forEach(v => {
      tr.insertCell().textContent = v;
    });

    // プラン状態バッジ
    const planTd  = tr.insertCell();
    const [label, cls] = PLAN_MAP[s.plan_status] || [s.plan_status || '-', 'b-canceled'];
    const planBadge = document.createElement('span');
    planBadge.className   = 'badge ' + cls;
    planBadge.textContent = label;
    planTd.appendChild(planBadge);

    // 操作ボタン (開発者店舗は完全に操作不可)
    const actTd = tr.insertCell();
    if (isDev) {
      const noOp = document.createElement('span');
      noOp.textContent = '開発者専用・操作不可';
      noOp.style.cssText = 'font-size:12px; color:#1D4ED8; font-weight:600;';
      actTd.appendChild(noOp);
    } else {
      const btn = document.createElement('button');
      btn.className   = 'toggle-btn ' + (s.is_paid ? 'btn-deactivate' : 'btn-activate');
      btn.textContent = s.is_paid ? '停止する' : '有効化する';
      btn.addEventListener('click', () => toggleShop(s.id, !s.is_paid, btn, s.shop_name));
      actTd.appendChild(btn);
    }

    const supportTd = tr.insertCell();
    const supportBtn = document.createElement('button');
    supportBtn.className = 'toggle-btn btn-activate';
    supportBtn.textContent = '詳細';
    supportBtn.addEventListener('click', () => loadShopSupport(s.id));
    supportTd.appendChild(supportBtn);

    // 登録日
    const dtTd = tr.insertCell();
    try { dtTd.textContent = new Date(s.created_at).toLocaleDateString('ja-JP'); }
    catch { dtTd.textContent = '-'; }
  });

  wrap.innerHTML = '';
  wrap.appendChild(tbl);
  renderPager('shopPager', allShops.length, shopPage, p => { shopPage = p; renderShops(); });
}

// ─── 店舗 活性化/停止 ─────────────────────────────────────
async function toggleShop(shopId, activate, btn, shopName) {
  const label       = activate ? '有効化' : '停止';
  const displayName = shopName || shopId;
  if (!confirm(`「${displayName}」を${label}しますか？`)) return;
  btn.disabled = true;

  try {
    const res = await fetch('/api/admin/activate-shop', {
      method: 'POST',
      headers: hdr(true),
      body: JSON.stringify({ shopId, activate }),
    });

    if (res.status === 401) { doLogout(); return; }
    if (res.status === 403) {
      alert('この店舗は開発者保護のため操作できません。');
      btn.disabled = false;
      return;
    }

    const data = await res.json();
    if (!data.success) {
      alert('操作に失敗しました。もう一度お試しください。');
      btn.disabled = false;
      return;
    }

    // ローカルデータを更新して再描画
    const shop = allShops.find(s => s.id === shopId);
    if (shop) {
      shop.is_paid     = activate;
      shop.plan_status = activate ? 'active' : 'suspended';
    }
    const paid = allShops.filter(s => s.is_paid).length;
    document.getElementById('sPaid').textContent = paid;
    document.getElementById('sMRR').textContent  = '¥' + (paid * BASE_PRICE).toLocaleString();
    renderShops();

  } catch (e) {
    alert('通信エラーが発生しました。');
    btn.disabled = false;
  }
}

// ─── ページネーション ──────────────────────────────────────
function renderPager(id, total, current, onPage) {
  const wrap = document.getElementById(id);
  wrap.innerHTML = '';
  if (total <= PAGE_SIZE) return;

  const totalPages = Math.ceil(total / PAGE_SIZE);

  const prev = document.createElement('button');
  prev.className   = 'page-btn';
  prev.textContent = '＜ 前へ';
  prev.disabled    = current <= 1;
  prev.addEventListener('click', () => onPage(current - 1));
  wrap.appendChild(prev);

  const info = document.createElement('span');
  info.className   = 'page-info';
  info.textContent = `${current} / ${totalPages} ページ (全${total}件)`;
  wrap.appendChild(info);

  const next = document.createElement('button');
  next.className   = 'page-btn';
  next.textContent = '次へ ＞';
  next.disabled    = current >= totalPages;
  next.addEventListener('click', () => onPage(current + 1));
  wrap.appendChild(next);
}

// ─── 更新ボタン ────────────────────────────────────────────
async function reloadReservations() {
  const btn = document.getElementById('refreshResBtn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/dashboard', { headers: hdr() });
    if (res.status === 401) { doLogout(); return; }
    const data = await res.json();
    allRes  = data.reservations || [];
    resPage = 1;
    document.getElementById('sTotal').textContent = allRes.length;
    document.getElementById('sToday').textContent = data.todayReservations;
    renderReservations();
  } catch (e) {
    alert('更新に失敗しました。');
  } finally {
    btn.disabled = false;
  }
}

async function reloadShops() {
  const btn = document.getElementById('refreshShopBtn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/dashboard', { headers: hdr() });
    if (res.status === 401) { doLogout(); return; }
    const data = await res.json();
    allShops  = data.shops || [];
    shopPage  = 1;
    const paid = allShops.filter(s => s.is_paid).length;
    document.getElementById('sShops').textContent = allShops.length;
    document.getElementById('sPaid').textContent  = paid;
    document.getElementById('sMRR').textContent   = '¥' + (paid * BASE_PRICE).toLocaleString();
    renderShops();
  } catch (e) {
    alert('更新に失敗しました。');
  } finally {
    btn.disabled = false;
  }
}

async function loadOps() {
  const btn = document.getElementById('opsRefreshBtn');
  if (btn) btn.disabled = true;
  try {
    const res = await fetch('/api/admin/ops', { headers: hdr() });
    if (res.status === 401) { doLogout(); return; }
    const data = await res.json();
    document.getElementById('opsStatus').textContent = data.health?.score != null ? data.health.score + '%' : (data.status === 'ok' ? 'OK' : '注意');
    document.getElementById('ops24h').textContent = data.metrics?.reservations24h ?? '-';
    document.getElementById('ops7d').textContent = data.metrics?.reservations7d ?? '-';
    document.getElementById('opsSync').textContent = data.metrics?.syncNeeded ?? '-';
    document.getElementById('opsUnresolved').textContent = data.metrics?.unresolvedConsultations ?? '-';
    renderOpsEvents(data.recentEvents || [], data.integrations || {}, data.unresolvedConsultations || [], data.health);
  } catch (e) {
    document.getElementById('opsTable').innerHTML = '<div class="empty">運用状態を取得できませんでした</div>';
  } finally {
    if (btn) btn.disabled = false;
  }
}

function renderOpsEvents(events, integrations, unresolved, health) {
  const wrap = document.getElementById('opsTable');
  wrap.innerHTML = '';
  const integ = document.createElement('div');
  integ.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;';
  [
    ['Resend', integrations.resend],
    ['Paddle API', integrations.paddleApi],
    ['Alert', integrations.alerts],
  ].forEach(([label, ok]) => {
    const b = document.createElement('span');
    b.className = 'badge ' + (ok ? 'b-active' : 'b-pending');
    b.textContent = label + ': ' + (ok ? 'ON' : 'OFF');
    integ.appendChild(b);
  });
  wrap.appendChild(integ);

  if (health?.checks?.length) {
    const healthBox = document.createElement('div');
    healthBox.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;';
    health.checks.forEach(check => {
      const b = document.createElement('span');
      b.className = 'badge ' + (check.ok ? 'b-active' : 'b-pending');
      b.textContent = check.label + ': ' + (check.ok ? 'OK' : '確認');
      healthBox.appendChild(b);
    });
    wrap.appendChild(healthBox);
  }

  if (unresolved.length > 0) {
    const unresolvedBox = document.createElement('div');
    unresolvedBox.className = 'empty';
    unresolvedBox.style.textAlign = 'left';
    unresolvedBox.innerHTML = '<strong>未確定の予約相談</strong><br>' + unresolved.slice(0, 5)
      .map(item => `${new Date(item.last_at).toLocaleString('ja-JP')} / ${esc(item.last_message || '-')}`)
      .join('<br>');
    wrap.appendChild(unresolvedBox);
  }

  if (events.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '運用イベントはまだありません';
    wrap.appendChild(empty);
    return;
  }

  const tbl = document.createElement('table');
  const hrow = tbl.createTHead().insertRow();
  ['時刻', 'レベル', '種別', 'メッセージ'].forEach(text => {
    const th = document.createElement('th');
    th.textContent = text;
    hrow.appendChild(th);
  });
  const tbody = tbl.createTBody();
  events.slice(0, 12).forEach(ev => {
    const tr = tbody.insertRow();
    const dt = tr.insertCell();
    try { dt.textContent = new Date(ev.created_at).toLocaleString('ja-JP'); }
    catch { dt.textContent = '-'; }
    const level = tr.insertCell();
    const badge = document.createElement('span');
    const cls = ev.level === 'info' ? 'b-active' : (ev.level === 'warn' ? 'b-pending' : 'b-expired');
    badge.className = 'badge ' + cls;
    badge.textContent = ev.level || '-';
    level.appendChild(badge);
    tr.insertCell().textContent = displayEventType(ev.type);
    tr.insertCell().textContent = displayEventMessage(ev.message);
  });
  wrap.appendChild(tbl);
}

function displayEventType(type) {
  const map = {
    ai_response_failed: 'auto_response_failed',
    ai_parse_failed: 'auto_parse_failed',
    auto_response_failed: 'auto_response_failed',
    auto_parse_failed: 'auto_parse_failed',
  };
  return map[type] || type || '-';
}

function displayEventMessage(message) {
  const oldPrefix = 'A' + 'I';
  return String(message || '-')
    .replace(new RegExp(oldPrefix + '予約Pro', 'g'), 'スマート予約Pro')
    .replace(new RegExp(oldPrefix, 'g'), '自動応答');
}

async function loadShopSupport(shopId) {
  const panel = document.getElementById('supportPanel');
  panel.innerHTML = '<div class="loading">読み込み中...</div>';
  try {
    const res = await fetch(`/api/admin/shop/${encodeURIComponent(shopId)}`, { headers: hdr() });
    if (res.status === 401) { doLogout(); return; }
    if (!res.ok) throw new Error('load failed');
    const data = await res.json();
    renderShopSupport(data);
    document.getElementById('supportPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    panel.innerHTML = '<div class="empty">店舗詳細を取得できませんでした</div>';
  }
}

function renderMiniTable(title, rows, columns) {
  const section = document.createElement('div');
  section.style.marginTop = '18px';
  const h = document.createElement('h3');
  h.className = 'section-title';
  h.style.marginBottom = '10px';
  h.textContent = title;
  section.appendChild(h);
  if (!rows || rows.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'データなし';
    section.appendChild(empty);
    return section;
  }
  const tbl = document.createElement('table');
  const hrow = tbl.createTHead().insertRow();
  columns.forEach(c => {
    const th = document.createElement('th');
    th.textContent = c.label;
    hrow.appendChild(th);
  });
  const tbody = tbl.createTBody();
  rows.slice(0, 8).forEach(row => {
    const tr = tbody.insertRow();
    columns.forEach(c => {
      const td = tr.insertCell();
      const value = typeof c.value === 'function' ? c.value(row) : row[c.value];
      td.textContent = value == null || value === '' ? '-' : String(value).slice(0, 120);
    });
  });
  section.appendChild(tbl);
  return section;
}

function renderShopSupport(data) {
  const panel = document.getElementById('supportPanel');
  panel.innerHTML = '';
  const shop = data.shop || {};
  const head = document.createElement('div');
  head.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;';
  [
    ['店舗名', shop.shop_name],
    ['メール', shop.owner_email],
    ['状態', shop.plan_status],
    ['有料', shop.is_paid ? 'YES' : 'NO'],
  ].forEach(([label, value]) => {
    const box = document.createElement('div');
    box.className = 'stat-card';
    const num = document.createElement('div');
    num.className = 'stat-num';
    num.style.fontSize = '18px';
    num.textContent = value || '-';
    const lbl = document.createElement('div');
    lbl.className = 'stat-lbl';
    lbl.textContent = label;
    box.appendChild(num);
    box.appendChild(lbl);
    head.appendChild(box);
  });
  panel.appendChild(head);

  const actions = document.createElement('div');
  actions.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;';
  const syncBtn = document.createElement('button');
  syncBtn.className = 'refresh-btn';
  syncBtn.textContent = 'この店舗の決済同期';
  syncBtn.addEventListener('click', () => syncPayments(shop.id));
  actions.appendChild(syncBtn);
  panel.appendChild(actions);

  const noteWrap = document.createElement('div');
  noteWrap.style.marginBottom = '18px';
  const note = document.createElement('textarea');
  note.style.cssText = 'width:100%;min-height:82px;border:1px solid var(--border);border-radius:8px;padding:10px;font-family:inherit;';
  note.placeholder = 'サポートメモ';
  note.value = shop.admin_note || '';
  const save = document.createElement('button');
  save.className = 'refresh-btn';
  save.textContent = 'メモ保存';
  save.style.marginTop = '8px';
  save.addEventListener('click', () => saveAdminNote(shop.id, note.value, save));
  noteWrap.appendChild(note);
  noteWrap.appendChild(save);
  panel.appendChild(noteWrap);

  panel.appendChild(renderMiniTable('最近の予約', data.reservations, [
    { label: '日付', value: 'reservation_date' },
    { label: '時間', value: r => r.reservation_time ? String(r.reservation_time).slice(0, 5) : '-' },
    { label: '顧客', value: 'customer_name' },
    { label: 'メニュー', value: 'service_type' },
    { label: '状態', value: 'status' },
  ]));
  panel.appendChild(renderMiniTable('最近の会話', data.conversations, [
    { label: '時刻', value: r => r.created_at ? new Date(r.created_at).toLocaleString('ja-JP') : '-' },
    { label: '役割', value: 'role' },
    { label: '内容', value: 'content' },
  ]));
  panel.appendChild(renderMiniTable('顧客カルテ', data.cartes, [
    { label: '顧客', value: 'customer_name' },
    { label: '来店', value: 'visit_count' },
    { label: '最終来店', value: 'last_visit_date' },
    { label: 'メモ', value: 'memo' },
  ]));
}

async function saveAdminNote(shopId, note, btn) {
  btn.disabled = true;
  try {
    const res = await fetch('/api/admin/shop-note', {
      method: 'POST',
      headers: hdr(true),
      body: JSON.stringify({ shopId, note }),
    });
    const data = await res.json();
    alert(data.success ? '保存しました。' : '保存に失敗しました。');
  } catch (e) {
    alert('通信エラーが発生しました。');
  } finally {
    btn.disabled = false;
  }
}

async function syncPayments(shopId) {
  const btn = document.getElementById('syncPaymentsBtn');
  if (btn && !shopId) btn.disabled = true;
  try {
    const res = await fetch('/api/admin/sync-payments', {
      method: 'POST',
      headers: hdr(true),
      body: JSON.stringify(shopId ? { shopId } : {}),
    });
    const data = await res.json();
    if (data.reason === 'paddle_api_key_missing') {
      alert('PADDLE_API_KEY が未設定のため、決済同期は利用できません。');
      return;
    }
    alert(`決済同期完了: ${(data.results || []).length}件`);
    await reloadShops();
    await loadOps();
  } catch (e) {
    alert('決済同期に失敗しました。');
  } finally {
    if (btn && !shopId) btn.disabled = false;
  }
}

async function downloadBackup() {
  try {
    const res = await fetch('/api/admin/backup', { headers: hdr() });
    if (!res.ok) throw new Error('backup failed');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `line-ai-bot-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('バックアップの作成に失敗しました。');
  }
}

document.addEventListener('DOMContentLoaded', init);
