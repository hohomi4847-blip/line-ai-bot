<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>認証中...</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0; background: #f0f4f8;
    }
    .box {
      text-align: center; color: #333;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #e0e0e0;
      border-top-color: #06C755; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>ログイン処理中...</p>
  </div>
  <script>
    const { createClient } = supabase;
    const client = createClient(
      'https://acotulmvutzpkgilfons.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjb3R1bG12dXR6cGtnaWxmb25zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU3MDI0NjQsImV4cCI6MjA2MTI3ODQ2NH0.yBCKsqFRGsS3WxiHFx4QeP7JVzJqvtNkPYexqwDvASA',
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: true,
          autoRefreshToken: true,
        }
      }
    );

    // 세션 처리 후 메인 페이지로 이동
    client.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        window.location.href = '/';
      } else {
        // 세션이 없으면 onAuthStateChange로 한 번 더 시도
        client.auth.onAuthStateChange((event, session) => {
          if (event === 'SIGNED_IN' && session) {
            window.location.href = '/';
          } else if (event === 'INITIAL_SESSION' && !session) {
            window.location.href = '/?error=auth_failed';
          }
        });
        // 3초 후에도 안 되면 메인으로
        setTimeout(() => {
          window.location.href = '/';
        }, 3000);
      }
    });
  </script>
</body>
</html>
