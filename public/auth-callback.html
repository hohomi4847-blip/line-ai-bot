<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>認証中...</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0; background: #f0f4f8;
    }
    .box { text-align: center; color: #333; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #e0e0e0;
      border-top-color: #06C755; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>ログイン処理中...</p>
  </div>
  <script>
    const { createClient } = supabase;
    const client = createClient(
      'https://acotulmvutzpkgilfons.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjb3R1bG12dXR6cGtnaWxmb25zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU3MDI0NjQsImV4cCI6MjA2MTI3ODQ2NH0.yBCKsqFRGsS3WxiHFx4QeP7JVzJqvtNkPYexqwDvASA',
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: true,
          autoRefreshToken: true,
        }
      }
    );

    var redirected = false;

    // ✅ SIGNED_IN 이벤트만 처리 (세션 확실히 있을 때만 이동)
    client.auth.onAuthStateChange(function(event, session) {
      if (event === 'SIGNED_IN' && session && !redirected) {
        redirected = true;
        window.location.href = '/';
      }
    });

    // ✅ 5초 후 세션 직접 확인 후 이동 (백업)
    setTimeout(function() {
      if (redirected) return;
      client.auth.getSession().then(function(result) {
        redirected = true;
        if (result.data.session) {
          window.location.href = '/';
        } else {
          window.location.href = '/';
        }
      });
    }, 5000);
  </script>
</body>
</html>
